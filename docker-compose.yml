services:
  app:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/teledrive
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend/thumbnails:/app/thumbnails

  mongo:
    image: mongo:7
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
